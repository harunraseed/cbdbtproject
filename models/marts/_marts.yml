version: 2

models:
  - name: dim_customer
    description: One row per customer version from the snapshot. Use is_current for today's view .......
    columns:
      - name: customer_key
        description: Surrogate key, hash of customer_id and valid_from.
        data_tests: [unique, not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_truck
    description: One row per truck.
    columns:
      - name: truck_key
        data_tests: [unique, not_null]

  - name: dim_menu
    description: One row per menu item, with brand category from the seed.
    columns:
      - name: menu_item_sk
        data_tests: [unique, not_null]
      - name: brand_category
        description: From seeds/truck_brand_category.csv.

  - name: dim_date
    description: One row per day, 2022 to 2025.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_orders
    description: >
      One row per order. Joined to the customer version valid at order time
      (SCD Type 2). Incremental on order_id with a 3-day lookback.
    columns:
      - name: order_id
        description: Primary key. Source system order identifier.
        data_tests: [unique, not_null]
      - name: order_date
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_day}
      - name: truck_key
        data_tests:
          - not_null
          - relationships: {to: ref('dim_truck'), field: truck_key}
      - name: customer_key
        description: Null for orders without a loyalty customer.
        data_tests:
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: order_total
        description: Final amount paid, after tax and discounts.

  - name: fct_order_items
    description: One row per order line with cost, profit and margin.
    columns:
      - name: order_detail_id
        data_tests: [unique, not_null]
      - name: menu_item_key
        description: References dim_menu.menu_item_sk.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_menu'), field: menu_item_sk}
      - name: margin_pct
        description: From the margin_pct macro. Null when revenue is zero.
